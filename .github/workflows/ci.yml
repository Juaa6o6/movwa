name: Movwa CI (Build Check)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. 백엔드(Django) 설정 및 테스트 검사
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # [변경점] Check 뿐만 아니라 Test까지 수행하도록 통합 및 강화
      - name: Check & Run Tests (설정 검사 및 테스트 수행)
        env:
          # 테스트용 임시 키
          SECRET_KEY: "django-insecure-test-key-for-ci-build"
          # TMDB API 키 주입 (Github Secrets 설정 필요)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "1. Django 설정 검사 (Check)"
          python manage.py check
          
          echo "2. 테스트 코드 실행 (Test)"
          # movies 앱의 테스트만 빠르게 실행
          python manage.py test movies
          
          # (선택 사항) 전체 테스트를 돌리고 싶다면 아래 주석 해제
          # python manage.py test

  # 2. 프론트엔드(Vue) 빌드 검사 (변경 없음)
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Test (화면 생성 검사)
        run: npm run build